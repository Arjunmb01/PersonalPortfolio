<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="100%" stop-color="#070707" />
    </linearGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faebd2" />
      <stop offset="35%" stop-color="#e2c592" />
      <stop offset="70%" stop-color="#c8a96e" />
      <stop offset="100%" stop-color="#917238" />
    </linearGradient>

    <!-- Deep Shadow Gold -->
    <linearGradient id="favGoldDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c8a96e" />
      <stop offset="100%" stop-color="#6e5320" />
    </linearGradient>

    <radialGradient id="favSpark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="40%" stop-color="#e2c592" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#c8a96e" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Base Icon Tile -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="#c8a96e" stroke-opacity="0.4" stroke-width="1.2" />

  <!-- Background Diamond Grid -->
  <path
    d="M32 6 L56 32 L32 58 L8 32 Z"
    fill="none"
    stroke="url(#favGold)"
    stroke-width="0.8"
    stroke-opacity="0.25"
    stroke-dasharray="2 2"
  />

  <!-- 'A' Left Pillar -->
  <path
    d="M32 9 L13 52 L21 52 L32 25 L32 9 Z"
    fill="url(#favGoldDark)"
  />

  <!-- 'A' Right Pillar -->
  <path
    d="M32 9 L51 52 L43 52 L32 25 L32 9 Z"
    fill="url(#favGold)"
  />

  <!-- 'A' Faceted Crossbar -->
  <path
    d="M21 39 L43 39 L41 43.5 L23 43.5 Z"
    fill="url(#favGold)"
  />

  <!-- Apex Star Spark -->
  <circle cx="32" cy="16" r="2" fill="#ffffff" />
  <circle cx="32" cy="16" r="6" fill="url(#favSpark)" />
</svg>